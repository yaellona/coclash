[package]
name = "coclash"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]
members = [".", "coclash-macros"]

[dependencies]
coclash-macros = { path = "coclash-macros" }
crossterm = "0.29.0"
dirs = "6.0.0"
indexmap = { version = "2", features = ["serde"] }
ratatui = "0.30.2"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
thiserror = "2"
tokio = { version = "1.52.3", features = ["full"] }
url = "2.5.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
